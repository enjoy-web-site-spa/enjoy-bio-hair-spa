<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area Riservata | Enjoy Parrucchieri Bio Hair Spa</title>
    <meta name="robots" content="noindex, nofollow">
    
    <!-- Tipografia Luxury Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-primary: #121212;
            --bg-card: #1A1A1A;
            --gold-primary: #D4AF37;
            --gold-hover: #AA7C11;
            --gold-light: #F3E5AB;
            --text-white: #F5F5F5;
            --text-gray: #A0A0A0;
            --font-title: 'Cinzel', serif;
            --font-body: 'Montserrat', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-primary);
            color: var(--text-white);
            font-family: var(--font-body);
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .admin-container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 1.5rem;
            position: relative;
        }

        header h1 {
            font-family: var(--font-title);
            color: var(--gold-primary);
            font-size: 1.8rem;
            letter-spacing: 2px;
        }

        header p {
            color: var(--text-gray);
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        .btn-logout {
            position: absolute;
            right: 0;
            top: 0;
            background: transparent;
            border: 1px solid #c93b3b;
            color: #c93b3b;
            padding: 0.4rem 0.8rem;
            font-size: 0.75rem;
            cursor: pointer;
            border-radius: 2px;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 4px;
            padding: 2rem;
            margin-bottom: 2.5rem;
        }

        .card-title {
            font-family: var(--font-title);
            color: var(--gold-light);
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--gold-primary);
            margin-bottom: 0.4rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        input[type="text"],
        input[type="number"],
        input[type="email"],
        input[type="password"],
        textarea,
        select {
            width: 100%;
            padding: 0.8rem;
            background-color: #121212;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 2px;
            color: var(--text-white);
            font-family: var(--font-body);
            font-size: 0.95rem;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--gold-primary);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 1rem;
        }

        .checkbox-group input {
            width: 20px;
            height: 20px;
            accent-color: var(--gold-primary);
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-hover));
            color: #000;
            padding: 0.9rem 2rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: none;
            cursor: pointer;
            border-radius: 2px;
            transition: transform 0.2s;
            width: 100%;
            margin-top: 1rem;
        }

        .btn-gold:hover { transform: translateY(-2px); }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-size: 0.8rem;
            border-radius: 2px;
            transition: all 0.2s;
        }

        .btn-outline:hover {
            background-color: var(--gold-primary);
            color: #000;
        }

        .services-list {
            display: grid;
            gap: 1rem;
        }

        .service-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #121212;
            padding: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
        }

        .service-item-info strong {
            color: var(--gold-light);
            display: block;
            font-size: 1rem;
        }

        .service-item-info span {
            font-size: 0.8rem;
            color: var(--text-gray);
        }

        .action-btns {
            display: flex;
            gap: 0.5rem;
        }

        .btn-edit {
            background-color: var(--gold-primary);
            color: #000;
            border: none;
            padding: 0.4rem 0.8rem;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 2px;
            cursor: pointer;
        }

        .btn-delete {
            background-color: #c93b3b;
            color: #fff;
            border: none;
            padding: 0.4rem 0.8rem;
            font-size: 0.75rem;
            border-radius: 2px;
            cursor: pointer;
        }

        .status-msg {
            margin-top: 1rem;
            padding: 0.8rem;
            border-radius: 2px;
            font-size: 0.85rem;
            display: none;
        }

        .status-success {
            background-color: rgba(40, 167, 69, 0.2);
            border: 1px solid #28a745;
            color: #28a745;
        }

        .status-error {
            background-color: rgba(220, 53, 69, 0.2);
            border: 1px solid #dc3545;
            color: #dc3545;
        }

        .categoria-switch {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        #sec-login { display: block; max-width: 450px; margin: 4rem auto 0 auto; }
        #sec-dashboard { display: none; }
    </style>
</head>
<body>

    <div class="admin-container">
        <header>
            <h1>Gestione Contenuti</h1>
            <p>Enjoy Parrucchieri Bio Hair Spa &bull; Area Riservata</p>
            <button id="btn-logout" class="btn-logout" style="display: none;" onclick="logout()">Disconnetti</button>
        </header>

        <!-- 1. FORM LOGIN -->
        <section id="sec-login" class="card">
            <h2 class="card-title" style="text-align: center;">Accesso Gestionale</h2>
            <form id="form-login">
                <div class="form-group">
                    <label for="login-email">Email Admin</label>
                    <input type="email" id="login-email" placeholder="Inserisci la tua email..." required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="Inserisci la password..." required>
                </div>
                <button type="submit" class="btn-gold" id="btn-login-submit">Accedi al Salone</button>
                <div id="login-status-msg" class="status-msg"></div>
            </form>
        </section>

        <!-- 2. PANNELLO DI CONTROLLO -->
        <main id="sec-dashboard">
            
            <!-- GESTIONE IMMAGINE HEADER / COPERTINA -->
            <section class="card">
                <h2 class="card-title"><span>Immagine Copertina Header (Home Page)</span></h2>
                <form id="form-header-img">
                    <div class="form-group">
                        <label for="header-immagine-file">Carica Foto Reale del Salone (Supabase Storage)</label>
                        <input type="file" id="header-immagine-file" accept="image/*" required>
                        <div id="preview-header-img" style="margin-top:0.8rem;"></div>
                    </div>
                    <button type="submit" class="btn-gold" id="btn-salva-header">Aggiorna Immagine Header</button>
                    <div id="header-status-msg" class="status-msg"></div>
                </form>
            </section>

            <!-- GESTIONE POP-UP PROMOZIONALE -->
            <section class="card">
                <h2 class="card-title">
                    <span>Gestione Pop-up Promozionale</span>
                    <button type="button" class="btn-outline" style="border-color:#c93b3b; color:#c93b3b;" onclick="disattivaPopup()">Disattiva Pop-up</button>
                </h2>
                <form id="form-popup">
                    <div class="checkbox-group">
                        <input type="checkbox" id="popup-attivo">
                        <label for="popup-attivo" style="margin-bottom:0; font-size:0.95rem;">Attiva Pop-up all'Ingresso del Sito</label>
                    </div>

                    <div class="form-group">
                        <label for="popup-titolo">Titolo Promozione</label>
                        <input type="text" id="popup-titolo" placeholder="es. Edizione Limitata: Cascata Giapponese Head Spa">
                    </div>

                    <div class="form-group">
                        <label for="popup-messaggio">Descrizione / Offerta</label>
                        <textarea id="popup-messaggio" rows="3" placeholder="Scrivi il messaggio della promozione..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="popup-immagine">Locandina / Foto Promo (Supabase Storage)</label>
                        <input type="file" id="popup-immagine" accept="image/*">
                        <div id="preview-popup-img" style="margin-top:0.5rem;"></div>
                    </div>

                    <div class="form-group">
                        <label for="popup-link">Link Pulsante Promozione</label>
                        <input type="text" id="popup-link" placeholder="Link WhatsApp o della Web App">
                    </div>

                    <button type="submit" class="btn-gold" id="btn-salva-popup">Salva Impostazioni Pop-up</button>
                    <div id="popup-status-msg" class="status-msg"></div>
                </form>
            </section>

            <!-- GESTIONE TRATTAMENTI -->
            <section class="card">
                <h2 class="card-title">
                    <span id="form-servizio-titolo">Aggiungi / Modifica Trattamento</span>
                    <button type="button" id="btn-annulla-modifica" class="btn-outline" style="display:none;" onclick="annullaModifica()">+ Nuovo Trattamento</button>
                </h2>
                <form id="form-servizio">
                    <input type="hidden" id="servizio-id">

                    <div class="form-group">
                        <label for="titolo">Titolo Trattamento</label>
                        <input type="text" id="titolo" placeholder="es. Cascata Giapponese Head Spa" required>
                    </div>

                    <div class="form-group">
                        <label for="categoria-select">Categoria</label>
                        <select id="categoria-select">
                            <option value="Hair Spa & Benessere">Hair Spa & Benessere</option>
                            <option value="Centro Cheratina">Centro Cheratina</option>
                            <option value="Trattamenti Botanici Oway">Trattamenti Botanici Oway</option>
                            <option value="Colorazioni Agricosmetiche">Colorazioni Agricosmetiche</option>
                            <option value="Abbonamenti & Pacchetti">Abbonamenti & Pacchetti</option>
                        </select>
                        
                        <div class="categoria-switch">
                            <button type="button" class="btn-outline" onclick="toggleNuovaCategoria()">+ Nuova Categoria Personalizzata</button>
                        </div>

                        <div id="box-nuova-categoria" style="display: none; margin-top: 0.8rem;">
                            <input type="text" id="nuova-categoria-input" placeholder="Scrivi qui il nome della nuova categoria...">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="descrizione">Descrizione Breve</label>
                        <textarea id="descrizione" rows="3" placeholder="Descrizione dettagliata per clienti e motori di ricerca IA..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="prezzo">Prezzo (€)</label>
                        <input type="number" id="prezzo" step="0.01" placeholder="45.00">
                    </div>

                    <div class="form-group">
                        <label for="immagine">Foto Trattamento (Carica su Supabase Storage)</label>
                        <input type="file" id="immagine" accept="image/*">
                        <div id="preview-servizio-img" style="margin-top:0.5rem;"></div>
                    </div>

                    <div class="form-group">
                        <label for="link_azione">Link Azione / Prenotazione (Opzionale)</label>
                        <input type="text" id="link_azione" placeholder="Link WhatsApp o della tua Web App">
                    </div>

                    <button type="submit" class="btn-gold" id="btn-salva">Salva Trattamento</button>
                    <div id="status-msg" class="status-msg"></div>
                </form>
            </section>

            <!-- LISTA SERVIZI ONLINE CON AZIONI EDIT/DELETE -->
            <section class="card">
                <h2 class="card-title">Trattamenti Attualmente On-line</h2>
                <div id="lista-servizi" class="services-list">
                    <p style="color: var(--text-gray);">Caricamento in corso...</p>
                </div>
            </section>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://rpbbbqekqkwzyhpjeusp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_mO9NkHSLtTZ-1sFWi__s-w_A5sj_TvX';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const formLogin = document.getElementById('form-login');
        const formServizio = document.getElementById('form-servizio');
        const formPopup = document.getElementById('form-popup');
        const formHeaderImg = document.getElementById('form-header-img');
        const secLogin = document.getElementById('sec-login');
        const secDashboard = document.getElementById('sec-dashboard');
        const btnLogout = document.getElementById('btn-logout');
        const statusMsg = document.getElementById('status-msg');
        const popupStatusMsg = document.getElementById('popup-status-msg');
        const headerStatusMsg = document.getElementById('header-status-msg');
        const loginStatusMsg = document.getElementById('login-status-msg');
        const listaServizi = document.getElementById('lista-servizi');
        
        let inserimentoCustomCategoria = false;
        let popupEsistenteId = null;
        let popupImmagineUrlAttuale = '';
        let servizioImmagineUrlAttuale = '';
        let listaServiziCaricati = [];

        function mostraMessaggio(el, testo, tipo) {
            el.textContent = testo;
            el.className = `status-msg status-${tipo}`;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 4000);
        }

        async function controllaSessione() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                mostraDashboard();
            } else {
                mostraLogin();
            }
        }

        function mostraDashboard() {
            secLogin.style.display = 'none';
            secDashboard.style.display = 'block';
            btnLogout.style.display = 'block';
            caricaServiziAdmin();
            caricaImpostazioniPopup();
            
            // Mostra anteprima dell'immagine header salvata se presente
            const savedHeaderBg = localStorage.getItem('enjoy_header_bg');
            if (savedHeaderBg) {
                document.getElementById('preview-header-img').innerHTML = `
                    <img src="${savedHeaderBg}" style="max-width: 200px; border:1px solid var(--gold-primary); border-radius:4px; display:block; margin-bottom:0.5rem;">
                    <span style="font-size:0.75rem; color:var(--text-gray);">Immagine attualmente attiva sul sito.</span>
                `;
            }
        }

        function mostraLogin() {
            secLogin.style.display = 'block';
            secDashboard.style.display = 'none';
            btnLogout.style.display = 'none';
        }

        formLogin.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const btnSubmit = document.getElementById('btn-login-submit');

            btnSubmit.disabled = true;
            btnSubmit.textContent = 'Verifica in corso...';

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                mostraMessaggio(loginStatusMsg, 'Credenziali errate: ' + error.message, 'error');
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Accedi al Salone';
            } else {
                mostraMessaggio(loginStatusMsg, 'Accesso autorizzato!', 'success');
                setTimeout(() => {
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = 'Accedi al Salone';
                    mostraDashboard();
                }, 1000);
            }
        });

        async function logout() {
            await supabaseClient.auth.signOut();
            mostraLogin();
        }

// SALVA IMMAGINE HEADER CON NOME FISSO E SOVRASCRITTURA (UPSERT)
        formHeaderImg.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btnSalvaHeader = document.getElementById('btn-salva-header');
            btnSalvaHeader.disabled = true;
            btnSalvaHeader.textContent = 'Caricamento in corso...';

            const fileInput = document.getElementById('header-immagine-file');

            try {
                if (fileInput.files.length === 0) {
                    throw new Error("Seleziona un'immagine da caricare.");
                }

                const file = fileInput.files[0];
                const fileExt = file.name.split('.').pop().toLowerCase();
                
                // NOME FISSO: usa sempre lo stesso nome per sovrascrivere il file sul bucket
                const fileName = `header-copertina-salone.${fileExt}`;

                // upsert: true forza la sovrascrittura immediata sul bucket Supabase Storage
                const { error: uploadError } = await supabaseClient
                    .storage
                    .from('immagini-salone')
                    .upload(fileName, file, { upsert: true });

                if (uploadError) throw uploadError;

                const { data: urlData } = supabaseClient
                    .storage
                    .from('immagini-salone')
                    .getPublicUrl(fileName);

                // Aggiungiamo un parametro temporale per l'anteprima admin
                const immagine_url = `${urlData.publicUrl}?t=${new Date().getTime()}`;

                document.getElementById('preview-header-img').innerHTML = `
                    <img src="${immagine_url}" style="max-width: 200px; border:1px solid var(--gold-primary); border-radius:4px; display:block; margin-bottom:0.5rem;">
                    <span style="font-size:0.75rem; color:var(--text-gray);">Immagine header caricata e fissata con successo!</span>
                `;

                mostraMessaggio(headerStatusMsg, 'Immagine header aggiornata con successo!', 'success');
            } catch (err) {
                console.error(err);
                mostraMessaggio(headerStatusMsg, 'Errore caricamento: ' + err.message, 'error');
            } finally {
                btnSalvaHeader.disabled = false;
                btnSalvaHeader.textContent = 'Aggiorna Immagine Header';
            }
        });

        // CARICA POPUP
        async function caricaImpostazioniPopup() {
            try {
                const { data, error } = await supabaseClient
                    .from('promozioni')
                    .select('*')
                    .limit(1);

                if (error) throw error;

                if (data && data.length > 0) {
                    const promo = data[0];
                    popupEsistenteId = promo.id;
                    popupImmagineUrlAttuale = promo.immagine_url || '';

                    document.getElementById('popup-attivo').checked = promo.attivo;
                    document.getElementById('popup-titolo').value = promo.titolo || '';
                    document.getElementById('popup-messaggio').value = promo.messaggio || '';
                    document.getElementById('popup-link').value = promo.link_bottone || '';

                    if (promo.immagine_url) {
                        document.getElementById('preview-popup-img').innerHTML = `
                            <img src="${promo.immagine_url}" style="max-width: 150px; border:1px solid var(--gold-primary); border-radius:4px;">
                        `;
                    }
                }
            } catch (err) {
                console.error('Errore nel caricamento del popup:', err);
            }
        }

        // SALVA POPUP
        formPopup.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btnSalvaPopup = document.getElementById('btn-salva-popup');
            btnSalvaPopup.disabled = true;
            btnSalvaPopup.textContent = 'Salvataggio in corso...';

            const attivo = document.getElementById('popup-attivo').checked;
            const titolo = document.getElementById('popup-titolo').value;
            const messaggio = document.getElementById('popup-messaggio').value;
            const link_bottone = document.getElementById('popup-link').value;
            const fileInput = document.getElementById('popup-immagine');

            let immagine_url = popupImmagineUrlAttuale;

            try {
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const fileExt = file.name.split('.').pop();
                    const fileName = `promo_${Date.now()}.${fileExt}`;

                    const { error: uploadError } = await supabaseClient
                        .storage
                        .from('immagini-salone')
                        .upload(fileName, file);

                    if (uploadError) throw uploadError;

                    const { data: urlData } = supabaseClient
                        .storage
                        .from('immagini-salone')
                        .getPublicUrl(fileName);

                    immagine_url = urlData.publicUrl;
                }

                const payload = { attivo, titolo, messaggio, immagine_url, link_bottone };

                let response;
                if (popupEsistenteId) {
                    response = await supabaseClient
                        .from('promozioni')
                        .update(payload)
                        .eq('id', popupEsistenteId);
                } else {
                    response = await supabaseClient
                        .from('promozioni')
                        .insert([payload]);
                }

                if (response.error) throw response.error;

                mostraMessaggio(popupStatusMsg, 'Pop-up aggiornato con successo!', 'success');
                caricaImpostazioniPopup();

            } catch (err) {
                console.error(err);
                mostraMessaggio(popupStatusMsg, 'Errore salvataggio pop-up: ' + err.message, 'error');
            } finally {
                btnSalvaPopup.disabled = false;
                btnSalvaPopup.textContent = 'Salva Impostazioni Pop-up';
            }
        });

        // DISATTIVA POPUP RAPIDO
        async function disattivaPopup() {
            if (!popupEsistenteId) return;
            try {
                const { error } = await supabaseClient
                    .from('promozioni')
                    .update({ attivo: false })
                    .eq('id', popupEsistenteId);

                if (error) throw error;
                document.getElementById('popup-attivo').checked = false;
                mostraMessaggio(popupStatusMsg, 'Pop-up disattivato.', 'success');
            } catch (err) {
                console.error(err);
                mostraMessaggio(popupStatusMsg, 'Errore disattivazione.', 'error');
            }
        }

        function toggleNuovaCategoria() {
            const boxNuova = document.getElementById('box-nuova-categoria');
            const selectCat = document.getElementById('categoria-select');
            inserimentoCustomCategoria = !inserimentoCustomCategoria;

            if (inserimentoCustomCategoria) {
                boxNuova.style.display = 'block';
                selectCat.style.display = 'none';
            } else {
                boxNuova.style.display = 'none';
                selectCat.style.display = 'block';
            }
        }

        // CARICA LISTA SERVIZI
        async function caricaServiziAdmin() {
            try {
                const { data, error } = await supabaseClient
                    .from('servizi')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                listaServiziCaricati = data || [];

                if (!data || data.length === 0) {
                    listaServizi.innerHTML = '<p style="color: var(--text-gray);">Nessun trattamento presente nel database.</p>';
                    return;
                }

                listaServizi.innerHTML = data.map(s => `
                    <div class="service-item">
                        <div class="service-item-info">
                            <strong>${s.titolo}</strong>
                            <span>${s.categoria || 'Generale'} &bull; € ${parseFloat(s.prezzo || 0).toFixed(2)}</span>
                        </div>
                        <div class="action-btns">
                            <button class="btn-edit" onclick="preparaModifica('${s.id}')">Modifica</button>
                            <button class="btn-delete" onclick="eliminaServizio('${s.id}')">Elimina</button>
                        </div>
                    </div>
                `).join('');

                const categorieUniche = [...new Set(data.map(item => item.categoria).filter(Boolean))];
                const selectCat = document.getElementById('categoria-select');
                if (categorieUniche.length > 0) {
                    selectCat.innerHTML = categorieUniche.map(c => `<option value="${c}">${c}</option>`).join('');
                }

            } catch (err) {
                console.error(err);
                listaServizi.innerHTML = '<p style="color: #c93b3b;">Errore durante il caricamento.</p>';
            }
        }

        // PREPARA MODIFICA SERVIZIO
        function preparaModifica(id) {
            const servizio = listaServiziCaricati.find(s => s.id === id);
            if (!servizio) return;

            document.getElementById('servizio-id').value = servizio.id;
            document.getElementById('titolo').value = servizio.titolo || '';
            document.getElementById('categoria-select').value = servizio.categoria || 'Hair Spa & Benessere';
            document.getElementById('descrizione').value = servizio.descrizione_breve || '';
            document.getElementById('prezzo').value = servizio.prezzo || '';
            document.getElementById('link_azione').value = servizio.link_azione || '';
            servizioImmagineUrlAttuale = servizio.immagine_url || '';

            if (servizio.immagine_url) {
                document.getElementById('preview-servizio-img').innerHTML = `
                    <img src="${servizio.immagine_url}" style="max-width: 120px; border:1px solid var(--gold-primary); border-radius:4px;">
                `;
            } else {
                document.getElementById('preview-servizio-img').innerHTML = '';
            }

            document.getElementById('form-servizio-titolo').textContent = 'Modifica Trattamento: ' + servizio.titolo;
            document.getElementById('btn-salva').textContent = 'Aggiorna Trattamento';
            document.getElementById('btn-annulla-modifica').style.display = 'inline-block';

            window.scrollTo({ top: document.getElementById('form-servizio').offsetTop - 20, behavior: 'smooth' });
        }

        function annullaModifica() {
            formServizio.reset();
            document.getElementById('servizio-id').value = '';
            servizioImmagineUrlAttuale = '';
            document.getElementById('preview-servizio-img').innerHTML = '';
            document.getElementById('form-servizio-titolo').textContent = 'Aggiungi / Modifica Trattamento';
            document.getElementById('btn-salva').textContent = 'Salva Trattamento';
            document.getElementById('btn-annulla-modifica').style.display = 'none';
        }

        // SALVA / AGGIORNA SERVIZIO
        formServizio.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btnSalva = document.getElementById('btn-salva');
            btnSalva.disabled = true;
            btnSalva.textContent = 'Salvataggio in corso...';

            const servizioId = document.getElementById('servizio-id').value;
            const titolo = document.getElementById('titolo').value;
            let categoria = inserimentoCustomCategoria 
                ? document.getElementById('nuova-categoria-input').value.trim() 
                : document.getElementById('categoria-select').value;

            if (!categoria) categoria = 'Hair Spa & Benessere';

            const descrizione = document.getElementById('descrizione').value;
            const prezzo = parseFloat(document.getElementById('prezzo').value) || 0.00;
            const link_azione = document.getElementById('link_azione').value;
            const fileInput = document.getElementById('immagine');

            let immagine_url = servizioImmagineUrlAttuale;

            try {
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${Date.now()}.${fileExt}`;

                    const { error: uploadError } = await supabaseClient
                        .storage
                        .from('immagini-salone')
                        .upload(fileName, file);

                    if (uploadError) throw uploadError;

                    const { data: urlData } = supabaseClient
                        .storage
                        .from('immagini-salone')
                        .getPublicUrl(fileName);

                    immagine_url = urlData.publicUrl;
                }

                const payload = {
                    titolo,
                    categoria,
                    descrizione_breve: descrizione,
                    prezzo,
                    immagine_url: immagine_url || null,
                    link_azione: link_azione || null
                };

                let response;
                if (servizioId) {
                    response = await supabaseClient
                        .from('servizi')
                        .update(payload)
                        .eq('id', servizioId);
                } else {
                    response = await supabaseClient
                        .from('servizi')
                        .insert([payload]);
                }

                if (response.error) throw response.error;

                mostraMessaggio(statusMsg, servizioId ? 'Trattamento aggiornato con successo!' : 'Trattamento salvato con successo!', 'success');
                annullaModifica();
                caricaServiziAdmin();

            } catch (err) {
                console.error(err);
                mostraMessaggio(statusMsg, 'Errore durante il salvataggio: ' + err.message, 'error');
            } finally {
                btnSalva.disabled = false;
            }
        });

        // ELIMINA SERVIZIO
        async function eliminaServizio(id) {
            if (!confirm('Sei sicuro di voler eliminare definitivamente questo trattamento?')) return;

            try {
                const { error } = await supabaseClient
                    .from('servizi')
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                mostraMessaggio(statusMsg, 'Trattamento eliminato.', 'success');
                caricaServiziAdmin();
            } catch (err) {
                console.error(err);
                mostraMessaggio(statusMsg, 'Errore durante l\'eliminazione.', 'error');
            }
        }

        // --- CONTROLLO PROPORZIONI IMMAGINE TRATTAMENTO ---
        document.getElementById('immagine').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const img = new Image();
            img.src = URL.createObjectURL(file);
            
            img.onload = function() {
                const width = this.width;
                const height = this.height;
                const ratio = width / height;
                
                const previewSlot = document.getElementById('preview-servizio-img');
                
                let avvisoProporzioni = '';
                if (ratio < 0.8) {
                    avvisoProporzioni = '<p style="color: #f39c12; font-size: 0.75rem; margin-top: 0.4rem;">⚠️ Attenzione: Questa immagine è molto verticale. Verrà ritagliata centralmente per adattarsi al box.</p>';
                } else {
                    avvisoProporzioni = '<p style="color: #27ae60; font-size: 0.75rem; margin-top: 0.4rem;">✔ Proporzioni ottimali per il layout.</p>';
                }

                previewSlot.innerHTML = `
                    <img src="${img.src}" style="max-width: 150px; max-height: 150px; border:1px solid var(--gold-primary); border-radius:4px; display:block;">
                    ${avvisoProporzioni}
                `;
            }
        });

        // --- CONTROLLO PROPORZIONI IMMAGINE HEADER ---
        document.getElementById('header-immagine-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const img = new Image();
            img.src = URL.createObjectURL(file);
            
            img.onload = function() {
                const width = this.width;
                const height = this.height;
                const ratio = width / height;
                
                const previewSlot = document.getElementById('preview-header-img');
                
                let avvisoProporzioni = '';
                if (ratio < 1.2) {
                    avvisoProporzioni = '<p style="color: #f39c12; font-size: 0.75rem; margin-top: 0.4rem;">⚠️ Consigliata foto con orientamento orizzontale (landscape) per l\'header.</p>';
                } else {
                    avvisoProporzioni = '<p style="color: #27ae60; font-size: 0.75rem; margin-top: 0.4rem;">✔ Formato orizzontale ideale per la copertina.</p>';
                }

                previewSlot.innerHTML = `
                    <img src="${img.src}" style="max-width: 200px; max-height: 120px; border:1px solid var(--gold-primary); border-radius:4px; display:block; margin-bottom:0.5rem;">
                    ${avvisoProporzioni}
                `;
            }
        });

        document.addEventListener('DOMContentLoaded', controllaSessione);
    </script>
    <!-- SCRIPT DEFINITIVO PER CARICARE L'HEADER FISSO DA SUPABASE STORAGE -->
    <script>

                // URL pubblico fisso del file sul tuo bucket Supabase Storage
                const supabaseStorageUrl = "https://rpbbbqekqkwzyhpjeusp.supabase.co/storage/v1/object/public/immagini-salone/header-copertina-salone.jpg";
                
                // Parametro anti-cache per azzerare qualsiasi blocco di GitHub Pages o dei browser

                heroSection.style.background = `linear-gradient(rgba(18, 18, 18, 0.75), rgba(18, 18, 18, 0.95)), url('${supabaseStorageUrl}${cacheBuster}') center/cover no-repeat`;

        });
    </script>
